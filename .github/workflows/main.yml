name: Main CI-pipeline

on:
  push:
  pull_request:
    types: [opened, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET7
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: 7.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build SpaceBattle.Lib --no-restore /p:ContinuousIntegrationBuild=true

      - name: Debug environment
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Base ref: ${{ github.base_ref }}"
          echo "Head ref: ${{ github.head_ref }}"
          echo "Ref: ${{ github.ref }}"
          git log -1
          git diff HEAD^ HEAD

      - name: Run tests with coverage
        run: dotnet test --collect:"XPlat Code Coverage"

      - name: Install reportgenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.2.5

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"**/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -reporttypes:"HtmlInline_AzurePipelines;TextSummary"

      - name: Display coverage summary
        run: cat CoverageReport/Summary.txt

      - name: Format
        run: dotnet format --verify-no-changes\
